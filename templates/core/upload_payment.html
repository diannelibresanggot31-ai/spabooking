<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Payment - Luxury Spa</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #6a0dad, #8a2be2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        h2 { color: #6a0dad; margin-bottom: 20px; }
        .amount {
            font-size: 24px;
            color: #8a2be2;
            font-weight: bold;
            margin: 15px 0;
        }
        .gcash-info {
            background: #f0f0f0;
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
        }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 500; }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        button {
            background: #6a0dad;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 25px;
            width: 100%;
            cursor: pointer;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>💳 Complete Payment</h2>
        <p>Booking #{{ booking.id }}</p>
        <div class="amount">Amount Due: ₱{{ booking.total_amount }}</div>
        
        <div class="gcash-info">
            <strong>📱 GCash Details:</strong><br>
            Account: Luxury Spa<br>
            Number: 0912-345-6789
        </div>
        
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="form-group">
                <label>GCash Reference Number</label>
                <input type="text" name="gcash_reference" required>
            </div>
            <div class="form-group">
                <label>Screenshot Proof</label>
                <input type="file" name="proof_image" accept="image/*" required>
            </div>
            <button type="submit">Submit Payment</button>
        </form>
    </div>
</body>
</html>
