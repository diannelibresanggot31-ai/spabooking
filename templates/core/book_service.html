<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Service - Luxury Spa</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f0ff;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(106,13,173,0.1);
        }
        h2 {
            color: #6a0dad;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: #333;
        }
        select, input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        button {
            background: #6a0dad;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }
        .btn-back {
            background: #6c757d;
            margin-top: 10px;
        }
        a {
            color: #6a0dad;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>📅 Book a Service</h2>
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label>Select Service</label>
                <select name="service_id" required>
                    <option value="">-- Select Service --</option>
                    {% for service in services %}
                    <option value="{{ service.id }}">{{ service.name }} - ₱{{ service.price }} ({{ service.duration_minutes }} mins)</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>Select Room (Optional)</label>
                <select name="room_id">
                    <option value="">-- No Room Needed --</option>
                    {% for room in rooms %}
                    <option value="{{ room.id }}">Room {{ room.room_number }} - {{ room.get_room_type_display }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>Booking Date</label>
                <input type="date" name="booking_date" required>
            </div>
            <div class="form-group">
                <label>Booking Time</label>
                <input type="time" name="booking_time" required>
            </div>
            <button type="submit">Proceed to Payment</button>
        </form>
        <a href="/dashboard/"><button class="btn-back" style="background:#6c757d;">Back to Dashboard</button></a>
    </div>
</body>
</html>
